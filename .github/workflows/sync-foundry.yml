name: Sync skills to Foundry

on:
  workflow_dispatch:
    inputs:
      project_name:
        description: Existing Foundry project name
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - '.github/skills/**'

permissions:
  id-token: write
  contents: read

jobs:
  sync:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: 07122d2f-74de-4565-bd61-4d673d621fe8
      - name: Upload immutable skill versions
        shell: pwsh
        run: ./scripts/Sync-Foundry.ps1 -ProjectName '${{ inputs.project_name || vars.FOUNDRY_PROJECT_NAME }}'